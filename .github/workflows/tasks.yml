name: Tasks

on: [push, pull_request]

jobs:
  lint-php:
    name: "php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4', '8.5', '8.6' ]
        typo3: [ '13' ]
        include:
          # phpro/grumphp does not allow PHP 8.6 yet
          - php: '8.6'
            ignorePlatformReqs: '--ignore-platform-req=php+'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: composer require typo3/minimal="^${{ matrix.typo3 }}.4" --dev --with-all-dependencies --no-interaction --no-progress ${{ matrix.ignorePlatformReqs }}
      # --ignore-platform-req=php+ may only skip the PHP check of dev dependencies (e.g. phpro/grumphp)
      - if: matrix.php == '8.6'
        run: composer check-platform-reqs --no-dev
      # TEMPORARY: print a PHPStan baseline of the existing code, removed again in the next commit
      - run: |
          ./vendor/bin/phpstan analyse --generate-baseline=phpstan-baseline.neon --allow-empty-baseline --no-progress --memory-limit=-1 || true
          echo '-----BASELINE-START-----'; cat phpstan-baseline.neon; echo '-----BASELINE-END-----'
      - run: ./vendor/bin/grumphp run --ansi
      - run: composer test
        env:
          typo3DatabaseDriver: pdo_sqlite
