name: PHP compatibility

on: [push, pull_request]

jobs:
  checks:
    name: "PHP ${{ matrix.php }} / TYPO3 ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        typo3: ['13']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: composer config lock true
      - name: Install actual dependencies for this TYPO3 release
        run: |-
          composer require "enshrined/svg-sanitize:~1.0.0" --dev --no-update --sort-packages --no-interaction
          composer require "typo3/cms-core:^${{ matrix.typo3 }}" --sort-packages --no-scripts --no-interaction -W
      - name: Run static checks
        run: ./vendor/bin/grumphp run --no-interaction --no-ansi
      - run: composer test
        env:
          typo3DatabaseDriver: pdo_sqlite
