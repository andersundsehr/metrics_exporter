name: PHP compatibility

on: [push, pull_request]

jobs:
  checks:
    name: "PHP ${{ matrix.php }} / TYPO3 ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        typo3: ["11", "12", "13"]
        exclude:
          - php: '8.1'
            typo3: '13'
    env:
      COMPOSER_AUTH: ${{ secrets.TYPO3_ELTS_COMPOSER_AUTH }}
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: composer config lock true
      - name: Configure TYPO3 ELTS when an authorized test license is available
        if: (matrix.typo3 == '11' || matrix.typo3 == '12') && vars.TYPO3_ELTS_REPOSITORY_URL != ''
        env:
          TYPO3_ELTS_REPOSITORY_URL: ${{ vars.TYPO3_ELTS_REPOSITORY_URL }}
        run: composer config --global repositories.typo3-elts composer "$TYPO3_ELTS_REPOSITORY_URL"
      - name: Install actual dependencies for this TYPO3 release
        run: |
          alias=0.22.99
          if [ "${{ matrix.typo3 }}" = "11" ]; then alias=0.18.99; fi
          composer require "enshrined/svg-sanitize:1.0.0 as $alias" --dev --no-update --sort-packages --no-interaction
          composer require "typo3/cms-core:^${{ matrix.typo3 }}" --sort-packages --no-scripts --no-interaction -W
      - run: composer validate --strict --no-check-publish
      - run: composer check-platform-reqs
      - run: composer audit --abandoned=report
      - run: bash tests/typo3-svg-sanitizer.sh
      - name: Run static checks
        run: ./vendor/bin/grumphp run --no-interaction --no-ansi 2>&1 | tee /tmp/metrics-static-checks.log
      - name: Report static check failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('/tmp/metrics-static-checks.log')
          if log.exists():
              message = log.read_text(errors='replace')[-5000:]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + message)
          PY
      - run: composer test
        env:
          typo3DatabaseDriver: pdo_sqlite
